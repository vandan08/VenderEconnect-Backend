spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vendor_connect}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  application:
    name: vendrconnect-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true



server:
  port: ${SERVER_PORT:8083}

jwt:
  secret: VendrConnectSecretKey2024!@#$%^&*()
  expiration: 86400000

logging:
  level:
    com.vendrconnect: DEBUG

# Google OAuth Configuration
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

# Chatbot Configuration
chatbot:
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-2.5-pro}
    max-tokens: ${GEMINI_MAX_TOKENS:150}
    temperature: ${GEMINI_TEMPERATURE:0.7}
  websocket:
    endpoint: /ws/chat
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:5173}