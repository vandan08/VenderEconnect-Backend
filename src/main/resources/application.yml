spring:
  data:
    mongodb:
      # For embedded MongoDB (current setup)
      database: vendrconnect
      # For external MongoDB (uncomment below, comment embedded section)
      # uri: mongodb://localhost:27017/vendrconnect
  application:
    name: vendrconnect-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

# Embedded MongoDB (comment this section to use external MongoDB)
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.6

server:
  port: 8083

jwt:
  secret: VendrConnectSecretKey2024!@#$%^&*()
  expiration: 86400000

logging:
  level:
    com.vendrconnect: DEBUG